AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Root Stack - Main Orchestrator

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  DynamoDBModule:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/dynamodb.yaml
      Parameters:
        Environment: !Ref Environment
      #   TableReadCapacity: 12
      #   TableWriteCapacity: 12
  CognitoModule:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/cognito.yaml
      Parameters:
        Environment: !Ref Environment
  S3Module:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/s3.yaml
      Parameters:
        Environment: !Ref Environment
  CloudFrontModule:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/cloudfront.yaml
      Parameters:
        Environment: !Ref Environment
        S3BucketName: !GetAtt S3Module.Outputs.BucketName
        S3BucketArn: !GetAtt S3Module.Outputs.BucketArn
        S3BucketRegionalDomainName: !GetAtt S3Module.Outputs.BucketRegionalDomainName
  LambdaModule:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./nested/lambda.yaml
      Parameters:
        Environment: !Ref Environment
        DynamoDBTableName: !GetAtt DynamoDBModule.Outputs.TableName
        DynamoDBTableArn: !GetAtt DynamoDBModule.Outputs.TableArn
        S3BucketName: !GetAtt S3Module.Outputs.BucketName
        S3BucketArn: !GetAtt S3Module.Outputs.BucketArn

Outputs:
  DynamoDBTableName:
    Description: Exported Table Name from Nested Stack
    Value: !GetAtt DynamoDBModule.Outputs.TableName
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDBTableName"

  DynamoDBTableArn:
    Description: Exported Table ARN from Nested Stack
    Value: !GetAtt DynamoDBModule.Outputs.TableArn
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDBTableArn"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt CognitoModule.Outputs.UserPoolId
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoModule.Outputs.UserPoolArn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt CognitoModule.Outputs.UserPoolClientId
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  S3BucketName:
    Description: Exported S3 Bucket Name
    Value: !GetAtt S3Module.Outputs.BucketName
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketName"

  S3BucketArn:
    Description: Exported S3 Bucket ARN
    Value: !GetAtt S3Module.Outputs.BucketArn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketArn"

  S3BucketRegionalDomainName:
    Description: Exported S3 Regional Domain Name for CloudFront
    Value: !GetAtt S3Module.Outputs.BucketRegionalDomainName
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketRegionalDomainName"

  CloudFrontDistributionId:
    Description: Exported CloudFront Distribution ID
    Value: !GetAtt CloudFrontModule.Outputs.DistributionId
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"

  CloudFrontDomainName:
    Description: Exported CloudFront Domain Name
    Value: !GetAtt CloudFrontModule.Outputs.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDomainName"

  UsersFunctionArn: ##
    Description: Users Lambda Function ARN
    Value: !GetAtt LambdaModule.Outputs.UsersFunctionArn

  MediaFunctionArn: ##
    Description: Media Lambda Function ARN
    Value: !GetAtt LambdaModule.Outputs.MediaFunctionArn