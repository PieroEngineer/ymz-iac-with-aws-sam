AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nested Stack - API Gateway HTTP API (v2) Module
Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client ID
  YummiziFunctionArn:
    Type: String
    Description: Yummizi Microservice Lambda ARN
Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name:
        Fn::Sub: yummizi-http-api-${Environment}
      StageName:
        Ref: Environment
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        AllowHeaders:
        - Authorization
        - Content-Type
        AllowOrigins:
        - '*'
        MaxAge: 3600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience:
              - Ref: UserPoolClientId
            IdentitySource: $request.header.Authorization
  EngineIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${YummiziFunctionArn}/invocations
      PayloadFormatVersion: '2.0'
  EngineProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: ANY /{proxy+}
      Target:
        Fn::Sub: integrations/${EngineIntegration}
  EngineRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: HttpApi
      RouteKey: ANY /
      Target:
        Fn::Sub: integrations/${EngineIntegration}
Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiId:
    Description: HTTP API Gateway ID
    Value:
      Ref: HttpApi
