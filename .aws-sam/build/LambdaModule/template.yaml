AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nested Stack - AWS Lambda Compute Module (Hono Microservices)
Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
  DynamoDBTableName:
    Type: String
    Description: DynamoDB Table Name
  DynamoDBTableArn:
    Type: String
    Description: DynamoDB Table ARN
  S3BucketName:
    Type: String
    Description: S3 Storage Bucket Name
  S3BucketArn:
    Type: String
    Description: S3 Storage Bucket ARN
  CloudFrontDomainName:
    Type: String
    Description: Domain name of the CloudFront distribution for media assets
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
    - arm64
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        CDN_DOMAIN:
          Ref: CloudFrontDomainName
        ENV:
          Ref: Environment
        TABLE_NAME:
          Ref: DynamoDBTableName
        BUCKET_NAME:
          Ref: S3BucketName
        NODE_ENV: production
Resources:
  YummiziEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: yummizi-engine-${Environment}
      CodeUri: YummiziEngineFunction
      Handler: index.handler
      Description: Monolithic Hono backend engine
      Policies:
      - Statement:
        - Sid: DynamoDBTableAccess
          Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          Resource:
          - Ref: DynamoDBTableArn
          - Fn::Sub: ${DynamoDBTableArn}/index/*
        - Sid: S3DirectAccess
          Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
            Fn::Sub: ${S3BucketArn}/*
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/index.ts
        Format: esm
        Minify: true
        Sourcemap: false
        Target: node24
      SamResourceId: YummiziEngineFunction
Outputs:
  YummiziFunctionArn:
    Description: Users Microservice Lambda ARN
    Value:
      Fn::GetAtt:
      - YummiziEngineFunction
      - Arn
