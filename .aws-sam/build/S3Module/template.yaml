AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack - Amazon S3 Media Storage Module
Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
Resources:
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: yummizi-media-storage-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3600
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: AbortIncompleteUploads
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 7
        - Id: ExpireNoncurrentVersions
          Status: Enabled
          NoncurrentVersionExpiration:
            NoncurrentDays: 30
Outputs:
  BucketName:
    Description: S3 Storage Bucket Name
    Value:
      Ref: StorageBucket
  BucketArn:
    Description: S3 Storage Bucket ARN
    Value:
      Fn::GetAtt:
      - StorageBucket
      - Arn
  BucketRegionalDomainName:
    Description: S3 Regional Domain Name (Required for CloudFront OAC origin setting)
    Value:
      Fn::GetAtt:
      - StorageBucket
      - RegionalDomainName
