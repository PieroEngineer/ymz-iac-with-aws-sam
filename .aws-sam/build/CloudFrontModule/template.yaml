AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack - Amazon CloudFront CDN with OAC Module
Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
  S3BucketName:
    Type: String
    Description: S3 Storage Bucket Name
  S3BucketArn:
    Type: String
    Description: S3 Storage Bucket ARN
  S3BucketRegionalDomainName:
    Type: String
    Description: S3 Regional Domain Name
Resources:
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: yummizi-media-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: Media CDN for app (${Environment})
        PriceClass: PriceClass_100
        Origins:
        - Id: S3MediaOrigin
          DomainName:
            Ref: S3BucketRegionalDomainName
          S3OriginConfig: {}
          OriginAccessControlId:
            Fn::GetAtt:
            - CloudFrontOAC
            - Id
        DefaultCacheBehavior:
          TargetOriginId: S3MediaOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: S3BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontServicePrincipalReadOnly
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${S3BucketArn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}
Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value:
      Ref: MediaDistribution
  DomainName:
    Description: CloudFront Domain Name (e.g. d111111abcdef8.cloudfront.net)
    Value:
      Fn::GetAtt:
      - MediaDistribution
      - DomainName
