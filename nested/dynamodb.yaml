AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack - DynamoDB Single-Table Module

# Parameters:
#   Environment:
#     Type: String
#     Description: Deployment environment (dev, staging, prod)
#   TableReadCapacity:
#     Type: Number
#     Default: 12
#   TableWriteCapacity:
#     Type: Number
#     Default: 12

Resources:
  SingleDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: "YummiziTable"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 20
        WriteCapacityUnits: 20
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSIPK
          AttributeType: S
        - AttributeName: GSISK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: "YummiziGsiTable"
          KeySchema:
            - AttributeName: GSIPK
              KeyType: HASH
            - AttributeName: GSISK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 2
            WriteCapacityUnits: 2
        - IndexName: "YummiziGsi2Table"
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
          ProvisionedThroughput:
            ReadCapacityUnits: 2
            WriteCapacityUnits: 2
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false  ## Consider turn it true in production
      SSESpecification:
        SSEEnabled: true
Outputs:
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref SingleDataTable
  TableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt SingleDataTable.Arn