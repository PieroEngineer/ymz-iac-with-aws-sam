AWSTemplateFormatVersion: '2010-09-09'
Description: Nested Stack - API Gateway HTTP API (v2) Module

Parameters:
  Environment:
    Type: String
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "yummizi-http-api-${Environment}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "https://yummizi.vercel.app"
          - "http://localhost:5173"
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        AllowCredentials: true
        MaxAge: 86400

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Environment
      AutoDeploy: true          # each new deployed Route/Integration goes live without a manual Deployment resource

  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"

Outputs:
  ApiId:
    Value: !Ref HttpApi
  AuthorizerId:
    Value: !Ref CognitoJwtAuthorizer
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"