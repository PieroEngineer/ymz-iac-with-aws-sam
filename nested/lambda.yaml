AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nested Stack - AWS Lambda Compute Module (Hono Microservices)

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
  DynamoDBTableName:
    Type: String
    Description: DynamoDB Table Name
  DynamoDBTableArn:
    Type: String
    Description: DynamoDB Table ARN
  S3BucketName:
    Type: String
    Description: S3 Storage Bucket Name
  S3BucketArn:
    Type: String
    Description: S3 Storage Bucket ARN

# Global defaults applied to all SAM Lambda functions in this template
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64 # AWS Graviton2 processor for higher performance and lower cost
    Timeout: 10 # Seconds
    MemorySize: 512 # MB
    Environment:
      Variables:
        ENV: !Ref Environment
        TABLE_NAME: !Ref DynamoDBTableName
        BUCKET_NAME: !Ref S3BucketName
        NODE_ENV: production

Resources:
  YummiziEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yummizi-engine-${Environment}"
      CodeUri: ../ #FIXME Points to the directory containing package.json & src/
      Handler: src/index.handler
      Description: Monolithic Hono backend engine
      Policies:
        - Statement:
            - Sid: DynamoDBTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !Ref DynamoDBTableArn
                - !Sub "${DynamoDBTableArn}/index/*"
            - Sid: S3DirectAccess
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${S3BucketArn}/*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        EntryPoints:
          - src/index.ts
          
Outputs:
  YummiziFunctionArn:
    Description: Users Microservice Lambda ARN
    Value: !GetAtt YummiziEngineFunction.Arn